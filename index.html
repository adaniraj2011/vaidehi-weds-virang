<style>
/* Layout: one tall mehrab card on pearl ivory — seal and title in the arch, then the form in short labelled groups. Single committed light look. */
:root{
  --pearl:#fbf7ef; --maroon:#7c1d3c; --maroon-soft:#965064; --olive:#8f8f52; --olive-deep:#6b6c38;
  --gold:#b49a5c; --rose:#e48a98; --ink:#3d2a2e; --line:#e6d9c8;
  --display:"Cinzel","Trajan Pro","Times New Roman",serif;
  --body:"Cormorant Garamond","Garamond","Georgia",serif;
  --script:"Pinyon Script","Snell Roundhand","Brush Script MT",cursive;
  color-scheme:light;
}

@keyframes bloomR{from{opacity:0;transform:scale(.55) rotate(10deg)}to{opacity:1;transform:none}}
@keyframes grow{from{opacity:0;transform:scaleY(.2)}to{opacity:1;transform:none}}

.body{position:relative;z-index:3;padding:15cqw 13cqw 34cqw;display:flex;flex-direction:column;align-items:center;text-align:center}
.seal{width:24cqw;filter:drop-shadow(0 8px 14px rgba(110,20,40,.3));animation:sealIn 1.1s cubic-bezier(.3,1.4,.4,1) both .3s,beat 2.6s ease-in-out 1.6s infinite}
.seal img{display:block;width:100%;height:auto}
@keyframes sealIn{from{opacity:0;transform:scale(.3) rotate(-25deg)}to{opacity:1;transform:none}}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.06)}24%{transform:scale(1)}36%{transform:scale(1.04)}}
.kick{margin:1.4cqw 0 0;font-family:var(--display);font-size:max(10.5px,2.8cqw);letter-spacing:.3em;padding-left:.3em;color:var(--olive-deep)}
h1{margin:3cqw 0 0;font-family:var(--script);font-weight:400;font-size:max(30px,9cqw);line-height:1.1;color:var(--maroon)}
.dates{margin:1.6cqw 0 0;font-family:var(--display);font-size:max(11px,3cqw);letter-spacing:.18em;color:var(--maroon)}
.lede{margin:3cqw 0 0;font-style:italic;font-weight:600;font-size:max(15px,4cqw);color:var(--maroon-soft);max-width:32ch}
.orn{display:block;width:36cqw;height:4.5cqw;margin:3.6cqw auto 1cqw;overflow:visible}
.orn path{fill:none;stroke:var(--gold);stroke-width:1.2;stroke-linecap:round;stroke-dasharray:80;stroke-dashoffset:80;animation:draw 1.6s ease forwards 1s}
.orn circle{fill:var(--rose)}
@keyframes draw{to{stroke-dashoffset:0}}

form{width:100%;display:grid;gap:22px;text-align:left;margin-top:2cqw}
fieldset{border:0;margin:0;padding:0;display:grid;gap:12px;opacity:0;animation:fadeUp .9s ease both;animation-delay:calc(1s + var(--i) * .15s)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
legend{padding:0;margin:0 0 2px;width:100%;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.22em;color:var(--olive-deep)}
legend::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(180,154,92,.7),transparent)}
legend .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--maroon);color:#fff;font-size:11px;letter-spacing:0}
.field{display:grid;gap:5px}
.field>span{font-weight:700;font-size:15px;color:var(--maroon)}
.field>span em{font-style:normal;color:#b3304f}
.field small{font-style:italic;font-weight:600;font-size:13.5px;color:var(--maroon-soft)}
input,select,textarea{font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:46px;color-scheme:light}
textarea{min-height:76px;resize:vertical}
input::placeholder,textarea::placeholder{color:#b9a8a2;font-weight:500}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--maroon);box-shadow:0 0 0 3px rgba(124,29,60,.14)}
.bad{border-color:#c2334f!important;box-shadow:0 0 0 3px rgba(194,51,79,.14)!important}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phone{display:flex;align-items:stretch}
.phone b{display:flex;align-items:center;padding:0 10px;background:#f7efe6;border:1px solid var(--line);border-right:0;border-radius:10px 0 0 10px;font-weight:700;color:var(--maroon)}
.phone input{border-radius:0 10px 10px 0}
.glist{display:grid;gap:8px}
.grow{display:grid;grid-template-columns:30px 1fr 40px;align-items:center;gap:8px;animation:fadeUp .35s ease both}
.grow .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#f7efe6;border:1px solid var(--line);font-family:var(--display);font-weight:700;font-size:13px;color:var(--maroon)}
.grow.first .no{background:var(--maroon);border-color:var(--maroon);color:#fff}
.grow .rm{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--maroon-soft);font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center}
.grow .rm:hover{background:#fdecef;color:#a3122f}
.grow .rm:focus-visible,.addg:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}
.grow.first .rm{display:none}
.grow.first input{grid-column:2/4}
.grow.out{animation:fadeOut .25s ease forwards}
@keyframes fadeOut{to{opacity:0;transform:translateX(12px)}}
.gbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.addg{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:11.5px;letter-spacing:.14em;color:var(--maroon);background:#fff;border:1.5px dashed var(--gold);border-radius:999px;padding:10px 16px;cursor:pointer;transition:background .2s}
.addg:hover{background:#fff6f7}
.addg[hidden]{display:none}
.addg b{font-size:17px;line-height:1}
.gcount{font-weight:700;font-size:15px;color:var(--maroon-soft)}
.gcount strong{font-family:var(--display);font-size:20px;color:var(--maroon);margin-left:6px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips input,.fns input{position:absolute;opacity:0;pointer-events:none}
.chips label{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px 9px;cursor:pointer;font-weight:700;font-size:15px;color:var(--maroon);transition:background .2s,color .2s,border-color .2s,transform .15s}
.chips label svg{width:26px;height:26px}
.chips input:checked+label{background:var(--maroon);border-color:var(--maroon);color:#fff;transform:translateY(-2px)}
.chips input:focus-visible+label,.fns input:focus-visible+label{box-shadow:0 0 0 3px rgba(124,29,60,.25)}
.sub{display:grid;gap:10px;padding:12px;border-radius:12px;background:#fff8f6;border:1px dashed rgba(180,154,92,.7);animation:fadeUp .4s ease both}
.fns{display:grid;gap:8px}
.fns label{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;transition:border-color .2s,background .2s}
.fns .tick{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--gold);display:grid;place-items:center;background:#fff;transition:background .2s,border-color .2s}
.fns .tick svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:opacity .2s,transform .2s}
.fns input:checked+label{border-color:var(--maroon);background:#fff6f7}
.fns input:checked+label .tick{background:var(--maroon);border-color:var(--maroon)}
.fns input:checked+label .tick svg{opacity:1;transform:none}
.fns .t b{display:block;font-weight:700;font-size:16px;color:var(--maroon);line-height:1.15}
.fns .t small{font-style:italic;font-weight:600;font-size:13.5px;color:var(--maroon-soft)}
.fns .d{font-family:var(--display);font-size:11px;letter-spacing:.12em;color:var(--olive-deep);text-align:right;line-height:1.2}
.fns .d strong{display:block;font-size:19px;letter-spacing:0;color:var(--maroon)}
.err{margin:0;padding:10px 12px;border-radius:10px;background:#fdecef;color:#a3122f;font-weight:700;font-size:15px}
.send{position:relative;overflow:hidden;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.22em;color:#fff;border:0;border-radius:999px;padding:16px;cursor:pointer;background:linear-gradient(180deg,#8c2747,#6f1733);box-shadow:0 10px 22px -10px rgba(124,29,60,.7)}
.send::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);animation:shine 3.2s ease-in-out infinite 2s}
@keyframes shine{0%{transform:translateX(-120%)}40%,100%{transform:translateX(120%)}}
.send:focus-visible{outline:2px solid var(--maroon);outline-offset:3px}
.send:disabled{opacity:.7}
.done{display:grid;gap:12px;justify-items:center;text-align:center;margin-top:4cqw;animation:fadeUp .8s ease both}
.done h2{margin:0;font-family:var(--script);font-weight:400;font-size:max(32px,9.4cqw);color:var(--maroon);line-height:1.1}
.done p{margin:0;font-style:italic;font-weight:600;font-size:17px;color:var(--maroon-soft);max-width:30ch}
.summary{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;color:var(--ink);display:grid;gap:4px}
.summary b{color:var(--maroon)}
.wa{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.16em;color:#fff;background:#2f7d4f;border-radius:999px;padding:13px 20px;text-decoration:none}
.again{background:none;border:0;font-family:var(--display);font-size:11px;letter-spacing:.2em;color:var(--maroon);cursor:pointer;padding:8px}
.again:focus-visible{outline:2px solid var(--maroon)}
.foot{margin-top:6cqw;max-width:56cqw;font-weight:600;font-size:14px;color:var(--maroon-soft)}
.foot .ph{font-family:var(--display);letter-spacing:.08em;color:var(--maroon);-webkit-user-select:all;user-select:all}
@media (max-width:360px){.chips label{font-size:14px}.row2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

      var inp=r.querySelector("input");inp.placeholder=k===0?"Your full name":"Guest "+(k+1)+" full name";inp.setAttribute("aria-label","Guest "+(k+1)+" name");
      r.querySelector(".rm").setAttribute("aria-label","Remove guest "+(k+1))});
    $("gcount").textContent=Math.max(1,names().length);$("addg").hidden=rows.length>=MAX}
  function addRow(val,focus){if(gl.children.length>=MAX)return;
    var r=document.createElement("div");r.className="grow";
    r.innerHTML='<span class="no" aria-hidden="true"></span><input type="text" autocomplete="off" maxlength="60"><button type="button" class="rm">\u2715</button>';
    var inp=r.querySelector("input");inp.value=val||"";
    inp.addEventListener("input",function(){this.classList.remove("bad");$("gcount").textContent=Math.max(1,names().length)});
    inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();var nx=r.nextElementSibling;if(nx)nx.querySelector("input").focus();else if(this.value.trim())addRow("",true)}});
    r.querySelector(".rm").addEventListener("click",function(){if(gl.children.length<2)return;var pv=r.previousElementSibling||r.nextElementSibling;r.classList.add("out");
      setTimeout(function(){r.remove();renum();if(pv)pv.querySelector("input").focus()},220)});
    gl.appendChild(r);renum();if(focus)inp.focus()}
  $("addg").addEventListener("click",function(){addRow("",true)});
  var first="";try{var n=new URLSearchParams(location.search).get("to");if(n)first=n.replace(/[<>]/g,"").slice(0,60)}catch(e){}
  addRow(first,false);
  function names(){return[].map.call(gl.querySelectorAll("input"),function(i){return i.value.trim()}).filter(Boolean)}

  /* mobile: digits only */
  $("mobile").addEventListener("input",function(){var d=this.value.replace(/\D/g,"").slice(-10);this.value=d.length>5?d.slice(0,5)+" "+d.slice(5):d;this.classList.remove("bad")});

  /* transport */
  [].forEach.call(f.querySelectorAll("input[name=mode]"),function(r){r.addEventListener("change",function(){
    $("sub-train").hidden=r.value!=="Train"&&!$("m-train").checked;
    $("sub-train").hidden=!$("m-train").checked;$("sub-flight").hidden=!$("m-flight").checked;$("sub-road").hidden=!$("m-road").checked;
    var s=$("sub-"+r.value.toLowerCase());if(s){var i=s.querySelector("input");setTimeout(function(){i.focus({preventScroll:true})},60)}})});

  function fmtDate(v){if(!v)return"";var p=v.split("-");var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return(+p[2])+" "+m[+p[1]-1]+" "+p[0]}
  function fmtTime(v){if(!v)return"";var p=v.split(":"),h=+p[0],ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+p[1]+" "+ap}

  function collect(){
    var mode=(f.querySelector("input[name=mode]:checked")||{}).value||"";
    var fns={};[].forEach.call(f.querySelectorAll("input[name=fn]"),function(c){fns[c.value]=c.checked});
    return{form:"relatives",names:names(),name:names().join(", ").slice(0,390),guests:names().length,mobile:$("mobile").value.replace(/\D/g,""),
      arrivalDate:fmtDate($("adate").value),arrivalTime:fmtTime($("atime").value),mode:mode,
      train:mode==="Train"?$("train").value.trim().slice(0,120):"",flight:mode==="Flight"?$("flight").value.trim().slice(0,120):"",road:mode==="Road"?($("road").value.trim().slice(0,120)||"Yes"):"",
      mehendi:fns.mehendi,grahShanti:fns.grahshanti,sangeet:fns.sangeet,marriage:fns.marriage,note:$("note").value.trim().slice(0,400),submittedAt:new Date().toISOString()}}

  function send(d){var body=JSON.stringify(d);
    function beacon(){try{navigator.sendBeacon&&navigator.sendBeacon(SHEET_URL,new Blob([body],{type:"text/plain;charset=utf-8"}))}catch(e){}}
    try{fetch(SHEET_URL,{method:"POST",mode:"no-cors",credentials:"omit",redirect:"follow",keepalive:true,headers:{"Content-Type":"text/plain;charset=utf-8"},body:body}).catch(beacon)}catch(e){beacon()}}

  function fail(msg,el){err.textContent=msg;err.hidden=false;if(el){el.classList.add("bad");el.focus();}else err.scrollIntoView({block:"center",behavior:"smooth"})}

  $("send").addEventListener("click",function(){err.hidden=true;
    var d=collect();
    if(!d.name)return fail("Please enter at least one guest name.",gl.querySelector("input"));
    [].forEach.call(gl.querySelectorAll("input"),function(i){if(!i.value.trim()&&gl.children.length>1)i.closest(".grow").remove()});renum();
    if(d.mobile.length!==10)return fail("Please enter a 10-digit mobile number.",$("mobile"));
    if(!d.mehendi&&!d.grahShanti&&!d.sangeet&&!d.marriage)return fail("Please tick at least one function you will attend.");
    if(SHEET_URL.indexOf("http")===0)send(d);
    var list=[d.mehendi&&"Mehendi",d.grahShanti&&"Grah Shanti",d.sangeet&&"Sangeet",d.marriage&&"Marriage"].filter(Boolean).join(", ");
    var travel=d.mode==="Train"?"Train – "+(d.train||"details later"):d.mode==="Flight"?"Flight – "+(d.flight||"details later"):d.mode==="Road"?"By road – "+d.road:"Not decided yet";
    var esc=function(s){var t=document.createElement("span");t.textContent=s;return t.innerHTML};
    $("summary").innerHTML="<div><b>"+d.guests+" guest"+(d.guests>1?"s":"")+":</b> "+esc(d.name)+"</div><div>+91 "+esc(d.mobile)+"</div><div>Arriving: "+esc((d.arrivalDate||"date TBC")+(d.arrivalTime?" at "+d.arrivalTime:""))+"</div><div>Travel: "+esc(travel)+"</div><div>Functions: "+esc(list)+"</div>";
    var msg="Guest details – Vaidehi & Virang's wedding\nGuests ("+d.guests+"):\n"+d.names.map(function(x,k){return"  "+(k+1)+". "+x}).join("\n")+"\nMobile: +91 "+d.mobile+"\nArriving Surat: "+(d.arrivalDate||"TBC")+(d.arrivalTime?" "+d.arrivalTime:"")+"\nTravel: "+travel+"\nFunctions: "+list+(d.note?"\nNote: "+d.note:"");
    $("wa").href="https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(msg);
    f.hidden=true;$("done").hidden=false;$("done").scrollIntoView({block:"center",behavior:"smooth"});
  });
  $("again").addEventListener("click",function(){$("done").hidden=true;f.hidden=false});
})();
</script>
